<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablica</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>
<body class="bg - light">

    <div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h3 class="mb-4">Novi Korisnik</h3>

                    <form>

                        <div class="mb-3">
                            <label class="form-label">Ime i Prezime</label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="npr. Ana Anić">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email adresa</label>

                            <input
                                type="email"
                                class="form-control"
                                placeholder="npr. ana@email.com">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Uloga</label>

                            <select class="form-select">
                                <option>Obični korisnik</option>
                                <option>Administrator</option>
                                <option>Urednik</option>
                            </select>
                        </div>

                        <button class="btn btn-success">
                            Spremi Korisnika
                        </button>

                    </form>

                </div>

            </div>

            <h3 class="mt-5 mb-3">Lista Korisnika</h3>

            <table class="table table-bordered">

                <thead class="table-primary">

                    <tr>
                        <th>ID</th>
                        <th>IME I PREZIME</th>
                        <th>EMAIL</th>
                        <th>ULOGA</th>
                        <th>AKCIJA</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>
                        <td>1</td>
                        <td>Ivan Horvat</td>
                        <td>ivan@tvrtka.hr</td>
                        <td>Administrator</td>
                        <td><a href="#" class="text-danger">Obriši</a></td>
                    </tr>

                    <tr>
                        <td>2</td>
                        <td>Marko Marić</td>
                        <td>marko@tvrtka.hr</td>
                        <td>Urednik</td>
                        <td><a href="#" class="text-danger">Obriši</a></td>
                    </tr>

                    <tr>
                        <td>3</td>
                        <td>Petra Perić</td>
                        <td>petra@tvrtka.hr</td>
                        <td>Korisnik</td>
                        <td><a href="#" class="text-danger">Obriši</a></td>
                    </tr>

                    <tr>
                        <td>4</td>
                        <td>Luka Lukić</td>
                        <td>luka@tvrtka.hr</td>
                        <td>Korisnik</td>
                        <td><a href="#" class="text-danger">Obriši</a></td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

    
</body>
</html>
